name: Flatten Domain Lists

on:
  # Запуск в 03:00 UTC каждый день
  schedule:
    - cron: '0 3 * * *'
  # Ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  flatten:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout текущего репозитория
        uses: actions/checkout@v4
        with:
          # Чтобы можно было запушить обратно
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: v2fly-domain-list-community

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск скрипта flatten
        run: python flatten.py

      - name: Коммит и пуш результатов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "flatten: обновление списков доменов ($(date -u +%Y-%m-%d))"
            git push
          fi
